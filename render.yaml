services:
  - type: web
    name: aula360
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma migrate deploy && npm run seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: aula360-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: SEED_BIENESTAR_EMAIL
        sync: false
      - key: SEED_BIENESTAR_NAME
        sync: false
      - key: SEED_BIENESTAR_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_SIMULATION
        value: "false"
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        value: es

databases:
  - name: aula360-db
    plan: free
    region: oregon
    databaseName: aula360
    user: aula360
